version: '3.8'

services:
  claw-bedrock:
    build: .
    container_name: claw-bedrock
    ports:
      - "4000:4000"  # LiteLLM proxy
      - "8282:8282"  # Management UI
    environment:
      - CONFIG_DIR=/app
      - MANAGEMENT_UI_PASSWORD=changeme
      # Add your API keys here
      # - OPENROUTER_API_KEY=your_key_here
      # - OPENAI_API_KEY=your_key_here
    volumes:
      # Mount local config directory for persistence across container restarts
      - ./local_config:/app:Z
    restart: unless-stopped
