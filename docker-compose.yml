version: '3.8'

services:
  claw-bedrock:
    image: ghcr.io/jeshii/claw-bedrock:latest
    # build: .  # Uncomment to build locally instead of using pre-built image
    ports:
      - "4000:4000"
      - "8282:8080"
    volumes:
      - ./config.local.yaml:/app/config.local.yaml:ro
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MANTLE_API_BASE=${BEDROCK_MANTLE_API_BASE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    restart: unless-stopped
