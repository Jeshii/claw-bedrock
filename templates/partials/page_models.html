<div id="page-models" class="page">
    <h1>Models</h1>
    <div class="section">
        <h2>Configured Models</h2>
        <div class="filter-bar" id="model-filter-bar" style="position:relative;"></div>
        <div id="models-list"></div>
        <button type="button" onclick="showAddModel()">Add New Model</button>
    </div>
    <div class="section hidden" id="add-model-section">
        <h2>
            Add New Model
            <button type="button" onclick="closeAddModel()" style="float:right;">
                <svg width="14"
                     height="14"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     style="vertical-align:middle"
                     aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                Close
            </button>
        </h2>
        <div id="model-provider-selector-wrap" style="margin-bottom:8px;"></div>
        <div id="provider-ui"></div>
    </div>
    <div class="section">
        <h2>Settings</h2>
        <div class="stack-sm">
            <label class="inline-row" style="cursor: pointer">
                <input type="checkbox"
                       id="use-prefix-toggle"
                       onchange="togglePrefix()"
                       style="margin-top: 3px;
                              flex-shrink: 0;
                              width: 16px">
                <span>Add <code>claw-bedrock/</code> prefix to model names</span>
            </label>
        </div>
    </div>
    <div class="section">
        <h2>Router Settings</h2>
        <p class="muted" style="font-size: 13px; margin-bottom: 12px;">
            Controls how LiteLLM routes requests and handles failures within model groups.
            Changes apply on the next LiteLLM reload.
        </p>
        <div class="stack-sm">
            <label class="inline-row" style="gap: 8px;">
                <span style="min-width: 140px; font-size: 13px;">Routing strategy:</span>
                <select id="routing-strategy"
                        onchange="saveRouterSetting()"
                        style="width: auto">
                    <option value="latency-based">Latency-based</option>
                    <option value="usage-based">Usage-based</option>
                    <option value="cost-based">Cost-based</option>
                    <option value="simple-shuffle">Shuffle</option>
                </select>
            </label>
            <label class="inline-row" style="gap: 8px;">
                <span style="min-width: 140px; font-size: 13px;">Allowed fails:</span>
                <input type="number"
                       id="allowed-fails"
                       min="1"
                       max="20"
                       value="3"
                       onchange="saveRouterSetting()"
                       style="width: 80px" />
                <span class="muted" style="font-size: 11px;">fails before model deactivated</span>
            </label>
            <label class="inline-row" style="gap: 8px;">
                <span style="min-width: 140px; font-size: 13px;">Retries on failure:</span>
                <input type="number"
                       id="num-retries"
                       min="0"
                       max="10"
                       value="2"
                       onchange="saveRouterSetting()"
                       style="width: 80px" />
                <span class="muted" style="font-size: 11px;">retries within the group</span>
            </label>
        </div>
    </div>
</div>
<dialog id="reload-warning-modal"
        style="padding:24px;
               border:1px solid #ddd;
               border-radius:8px;
               max-width:500px">
    <h3 style="margin-top:0;">Reload LiteLLM?</h3>
    <p style="font-size:14px;">You have pending model changes that require a LiteLLM reload.</p>
    <div class="inline-row" style="margin-top:16px;">
        <button type="button"
                class="btn-primary"
                onclick="dismissReloadWarning(true)">Reload Now</button>
        <button type="button"
                class="btn-secondary"
                onclick="dismissReloadWarning(false)">Dismiss</button>
    </div>
</dialog>
