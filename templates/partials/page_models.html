<div id="page-models" class="page">
    <h1>Models</h1>
    <div class="section">
        <h2>Configured Models</h2>
        <div class="filter-bar" id="model-filter-bar" style="position:relative;"></div>
        <div id="models-list"></div>
        <button type="button" onclick="showAddModel()">Add New Model</button>
        <button type="button"
                id="reload-litellm-btn"
                onclick="reloadLiteLLM()"
                title="Manually trigger LiteLLM config reload">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 style="vertical-align:middle"
                 aria-hidden="true">
                <path d="M1 4v6h6M23 20v-6h-6" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
            </svg>
            Reload LiteLLM
        </button>
    </div>
    <div class="section hidden" id="add-model-section">
        <h2>
            Add New Model
            <button type="button" onclick="closeAddModel()" style="float:right;">
                <svg width="14"
                     height="14"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     style="vertical-align:middle"
                     aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                Close
            </button>
        </h2>
        <div id="model-provider-selector-wrap" style="margin-bottom:8px;"></div>
        <div id="provider-ui"></div>
    </div>
    <div class="section">
        <h2>Settings</h2>
        <div class="stack-sm">
            <label class="inline-row" style="cursor: pointer">
                <input type="checkbox"
                       id="use-prefix-toggle"
                       onchange="togglePrefix()"
                       style="margin-top: 3px;
                              flex-shrink: 0;
                              width: 16px">
                <span>Add <code>claw-bedrock/</code> prefix to model names</span>
            </label>
        </div>
    </div>
</div>
