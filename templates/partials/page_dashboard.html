<div id="page-dashboard" class="page active">
    <h1>Dashboard</h1>
    <!-- Auth banner: shown on dashboard whenever AWS login is needed -->
    <div id="dashboard-auth-banner">
        <div id="banner-body"></div>
        <div class="banner-actions">
            <button type="button" class="go-auth-btn" onclick="showPage2('auth')">Go to Authentication →</button>
        </div>
    </div>
    <!-- Encryption warning banner: shown when using dev encryption key -->
    <div id="encryption-warning-banner">
        <button type="button"
                class="banner-dismiss"
                onclick="dismissEncryptionBanner()"
                title="Dismiss">✕</button>
        <div class="banner-title">Encryption Warning</div>
        <div class="banner-message">
            Using development encryption key. Provider API keys are encrypted with a predictable key. Set <code>ENCRYPTION_KEY</code> or <code>ENCRYPTION_PASSWORD</code> for production use.
        </div>
    </div>
    <div class="section" id="dashboard-info">
        <h2>Server Information</h2>
        <div id="server-status">Loading...</div>
    </div>
</div>
