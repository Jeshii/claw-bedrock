<div id="page-logs" class="page">
    <h1>Logs</h1>
    <div class="section">
        <div class="section-header-row">
            <h2>LiteLLM Logs</h2>
            <button type="button"
                    onclick="copyLogs()"
                    id="copy-logs-btn"
                    title="Copy log contents"
                    style="padding:4px 6px;
                           background:none;
                           border:1px solid #ccc;
                           border-radius:4px;
                           cursor:pointer;
                           line-height:0">
                <svg width="16"
                     height="16"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     style="vertical-align:middle"
                     aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
            </button>
        </div>
        <button type="button" onclick="loadLogs()">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 style="vertical-align:middle"
                 aria-hidden="true">
                <path d="M1 4v6h6M23 20v-6h-6" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
            </svg>
            Refresh Logs
        </button>
        <button type="button"
                id="auto-refresh-toggle"
                onclick="toggleAutoRefresh('logs')"
                disabled
                title="Auto-refresh logs"
                style="padding:4px 8px;
                       border:1px solid #ccc;
                       border-radius:4px;
                       cursor:pointer;
                       line-height:0">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 style="vertical-align:middle"
                 aria-hidden="true">
                <path d="M1 4v6h6M23 20v-6h-6" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
            </svg>
        </button>
        <select id="auto-refresh-interval"
                style="padding:4px;
                       border:1px solid #ccc;
                       border-radius:4px;
                       font-size:12px">
            <option value="2000">2s</option>
            <option value="5000" selected>5s</option>
            <option value="10000">10s</option>
        </select>
        <select id="log-lines" onchange="loadLogs()">
            <option value="50">Last 50 lines</option>
            <option value="100">Last 100 lines</option>
            <option value="200">Last 200 lines</option>
        </select>
        <div class="log-panel" id="logs-panel" style="position:relative;">
            <pre id="logs-output"
                 class="code-block scroll-panel hidden"
                 style="font-size: 12px; min-height: 100px;"></pre>
             <div class="resize-handle" data-for="logs-output" style="display:none" onmousedown="startResize(event, 'logs-output')"></div>
         </div>
         <button type="button"
                 onclick="toggleLog('logs-output', 'logs-toggle')"
                 id="logs-toggle"
                style="font-size: 12px;
                       padding:4px 8px;
                       border:1px solid #ccc;
                       border-radius:4px;
                       cursor:pointer;
                       margin-top: 8px">Show Logs</button>
    </div>
